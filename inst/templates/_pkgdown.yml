# Standard openwashdata _pkgdown.yml, written by washr::setup_website().
# `url` is the site base URL (canonical links, sitemap.xml, redirects), so it
# is the Pages URL, never the GitHub repository URL; the repository link lives
# in home.links below. The in_header block is the openwashdata analytics
# header. washr keeps this file as it is on every later run.
url: https://openwashdata.github.io/{{{name}}}/
template:
  bootstrap: 5
  includes:
    in_header: |
      <script defer data-domain="openwashdata.github.io" src="https://plausible.io/js/script.js"></script>

home:
  links:
    - icon: github
      text: GitHub repository
      href: https://github.com/openwashdata/{{{name}}}
  sidebar:
    structure: [links, citation, authors, dev, custom]
    components:
      custom:
        title: Funding
        text: This project was funded by the [Open Research Data Program of the ETH Board](https://ethrat.ch/en/eth-domain/open-research-data/).

authors:
  footer:
    roles: [cre, fnd]
    text: "Crafted by"
  sidebar:
    roles: [cre, aut, ctb]
    before: "So *who* does the work?"
    after: "Thanks all!"
{{#has_datasets}}

# One entry per data object in data/, each under its own descriptive name.
# Add every new data object here, or the site build stops.
reference:
- title: "Data"
  desc: "Access the {{{name}}} datasets"
  contents:
{{#datasets}}
  - {{{.}}}
{{/datasets}}
{{/has_datasets}}
