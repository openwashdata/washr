url: https://openwashdata.github.io/washr/
template:
  bslib:
    brand: _brand.yml
  bootstrap: 5
  light-switch: true
  opengraph:
    image:
      src: https://raw.githubusercontent.com/openwashdata/brand/v1.1.0/assets/social-preview.png
      alt: openwashdata, social preview image
  includes:
    in_header: |
      <script defer data-domain="openwashdata.github.io" src="https://plausible.io/js/script.js"></script>

navbar:
  structure:
    right: [search, home, github, lightswitch]
  components:
    home:
      text: openwashdata.org
      href: https://openwashdata.org
      aria-label: openwashdata website

home:
  links:
    - icon: github
      text: GitHub repository
      href: https://github.com/openwashdata/washr
  sidebar:
    structure: [links, license, community, citation, authors, dev, custom, openwashdata]
    components:
      custom:
        title: Funding
        text: This project was funded by the [Open Research Data Program of the ETH Board](https://ethrat.ch/en/eth-domain/open-research-data/).
      openwashdata:
        title: openwashdata
        text: This package is part of [openwashdata](https://openwashdata.org). Browse the [data catalogue](https://openwashdata.org/pages/gallery/data/) or get the [newsletter](https://openwashdata.org/pages/newsletter/).

footer:
  structure:
    left: [developed_by, publisher]
    right: [built_with]
  components:
    publisher: Published by [openwashdata](https://openwashdata.org), a project of [Global Health Engineering](https://ghe.ethz.ch/) at ETH Zurich.

reference:
- title: "Set up the data package"
  desc: "Scaffold the raw data folder and the processing script"
  contents:
  - setup_ci
  - setup_rawdata

- title: "Document the data"
  desc: "The dictionary and the roxygen documentation it feeds"
  contents:
  - setup_dictionary
  - update_dictionary
  - setup_roxygen

- title: "Describe the package"
  desc: "DESCRIPTION as the canonical source, and the schema.org metadata derived from it (experimental)"
  contents:
  - update_description
  - update_metadata

- title: "Publish"
  desc: "README, website, brand, and the citation with its DOI"
  contents:
  - setup_readme
  - setup_website
  - update_website
  - use_brand
  - update_citation
  - update_zenodo_json
  - check_publication_readiness
  - data_availability_statement
